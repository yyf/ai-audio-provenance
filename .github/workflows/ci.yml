name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install c2patool
        run: |
          C2PA_VERSION=0.26.62
          curl -fsSL -o /tmp/c2patool.tgz \
            "https://github.com/contentauth/c2pa-rs/releases/download/c2patool-v${C2PA_VERSION}/c2patool-v${C2PA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/c2patool.tgz -C /tmp
          sudo install -m 755 /tmp/c2patool/c2patool /usr/local/bin/c2patool
          c2patool --version
      - name: Install packages
        run: |
          pip install -e packages/audio_prov -e packages/audio_prov_mcp pytest ruff
      - name: Generate fixtures
        run: python scripts/generate_fixtures.py
      - name: Ruff
        run: ruff check packages tests
      - name: Pytest
        run: pytest -q
