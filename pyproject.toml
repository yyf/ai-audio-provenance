[project]
name = "ai-audio-provenance"
version = "0.1.0"
description = "Audio provenance analysis with MCP adapter for real-world AI audio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "audio-prov",
    "audio-prov-mcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv.sources]
audio-prov = { workspace = true }
audio-prov-mcp = { workspace = true }

[tool.uv.workspace]
members = ["packages/audio_prov", "packages/audio_prov_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages/audio_prov", "packages/audio_prov_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
