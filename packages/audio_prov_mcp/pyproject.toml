[project]
name = "audio-prov-mcp"
version = "0.1.0"
description = "MCP server for audio provenance analysis"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "audio-prov",
    "mcp>=1.2.0",
]

[project.scripts]
audio-prov-mcp = "audio_prov_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_prov_mcp"]

[tool.uv.sources]
audio-prov = { workspace = true }
