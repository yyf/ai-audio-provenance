[project]
name = "audio-prov"
version = "0.1.0"
description = "Core audio provenance analysis library"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "cryptography>=42.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
]

[project.scripts]
audio-prov = "audio_prov.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["audio_prov"]
